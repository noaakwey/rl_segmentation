image_path: data/raw/satellite_image.tif
shapefile_path: data/raw/crop_boundaries.shp
patch_size: 256
stride: 128
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15
output_dir: experiments/step_14_ep100_ppr04_f1
seed: 42
training_plots:
  smooth_window: 5

normalization:
  mode: percentile
  p_low: 1
  p_high: 99

supervised:
  batch_size: 8
  num_epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0001
  min_learning_rate: 0.000001
  lr_reduce_factor: 0.5
  lr_reduce_patience: 3
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  bce_weight: 0.5
  dice_weight: 0.5
  boundary_weight: 0.02
  boundary_dilation: 0
  balance: true
  min_crop_fraction: 0.01
  positive_patch_ratio: 0.4
  base_channels: 32
  bands: all
  augmentations:
    enabled: true
    hflip: true
    hflip_p: 0.5
    vflip: true
    vflip_p: 0.5
    rotate90: true
    rotate90_p: 0.5
    shift_scale_rotate: true
    shift_scale_rotate_p: 0.5
    shift_limit: 0.05
    scale_limit: 0.1
    rotate_limit: 10

supervised_eval:
  threshold_min: 0.3
  threshold_max: 0.7
  threshold_steps: 9
  threshold_metric: f1
  n_visualize: 6
  use_tta: true

production:
  tile_size: 2048
  context: 128
  threshold: 0.3
  use_tta: false
  batch_size: 4
  bands: [1, 2, 3, 4]
  use_alpha_mask: false
  global_percentile: true
  percentile_downsample: 1024
  min_area_pixels: 4096
  vectorize: true

ablations:
  enabled: false
  run_eval: true
  variants:
    - name: rgb
      bands: [1, 2, 3]
    - name: rgb_nir
      bands: [1, 2, 3, 4]
    - name: indices_only
      bands: [5, 6, 7]
