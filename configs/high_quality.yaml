# High quality configuration for best results

# Data paths
image_path: 'data/raw/satellite_image.tif'
shapefile_path: 'data/raw/crop_boundaries.shp'

# Data processing
patch_size: 512  # Larger patches for more context
stride: 256
train_ratio: 0.7
val_ratio: 0.15
test_ratio: 0.15

# Environment settings
action_mode: 'patch'
reward_type: 'dice'
num_actions: 64  # 8x8 grid for finer control
sequential: false

# Model architecture
in_channels: 4
feature_extractor: 'resnet'  # More powerful extractor

# Training hyperparameters
num_epochs: 200
episodes_per_epoch: 20
val_episodes: 10

# PPO hyperparameters
learning_rate: 1.0e-4  # Lower learning rate for stability
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
entropy_coef: 0.005  # Lower entropy for more deterministic policy
ppo_epochs: 10  # More update epochs
batch_size: 128

# Logging and checkpointing
save_interval: 10
use_wandb: true
wandb_project: 'rl_crop_segmentation'
experiment_name: 'high_quality'

# Output
output_dir: 'experiments/high_quality'
